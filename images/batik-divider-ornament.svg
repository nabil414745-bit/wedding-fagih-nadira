<svg xmlns="http://www.w3.org/2000/svg" width="360" height="24" viewBox="0 0 360 24" fill="none">
  <defs>
    <linearGradient id="divGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0"/>
      <stop offset="20%" stop-color="#E5C378" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#FFDF88" stop-opacity="1"/>
      <stop offset="80%" stop-color="#E5C378" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Left Line -->
  <line x1="10" y1="12" x2="140" y2="12" stroke="url(#divGold)" stroke-width="1.2"/>
  <circle cx="140" cy="12" r="2" fill="#E5C378"/>

  <!-- Center Batik Floral Motif -->
  <g transform="translate(180, 12)">
    <!-- Center Diamond & Flower -->
    <path d="M0,-8 L8,0 L0,8 L-8,0 Z" fill="none" stroke="#E5C378" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFDF88"/>
    
    <!-- Left Leaf Petal -->
    <path d="M-8,0 C-16,-6 -24,0 -32,-3 C-24,4 -16,4 -8,0 Z" fill="none" stroke="#E5C378" stroke-width="1"/>
    <circle cx="-32" cy="-3" r="1.5" fill="#FFDF88"/>

    <!-- Right Leaf Petal -->
    <path d="M8,0 C16,-6 24,0 32,-3 C24,4 16,4 8,0 Z" fill="none" stroke="#E5C378" stroke-width="1"/>
    <circle cx="32" cy="-3" r="1.5" fill="#FFDF88"/>
  </g>

  <!-- Right Line -->
  <circle cx="220" cy="12" r="2" fill="#E5C378"/>
  <line x1="220" y1="12" x2="350" y2="12" stroke="url(#divGold)" stroke-width="1.2"/>
</svg>
