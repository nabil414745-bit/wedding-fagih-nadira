      <stop offset="0%" stop-color="#FFDF88"/>
      <stop offset="50%" stop-color="#E5C378"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
  </defs>

  <g stroke="url(#cornerGold)" stroke-width="1.2" fill="none" stroke-linecap="round">
    <!-- Outer Border Lines -->
