<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2560" viewBox="0 0 1440 2560">
  <defs>
    <!-- Rich Warm Gold & Ivory Luxury Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FBF6EE;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#F5EAD8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FAF2E6;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#F3E6D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F8F0E4;stop-opacity:1" />
    </linearGradient>

    <!-- Radial Gold Glow Spotlight -->
    <radialGradient id="goldSpotlight" cx="50%" cy="25%" r="70%">
      <stop offset="0%" style="stop-color:#D4B475;stop-opacity:0.28" />
      <stop offset="45%" style="stop-color:#C9A96E;stop-opacity:0.14" />
      <stop offset="100%" style="stop-color:#FBF6EE;stop-opacity:0" />
    </radialGradient>

    <!-- Deep Ambient Glow -->
    <radialGradient id="bottomGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" style="stop-color:#C9A96E;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#FBF6EE;stop-opacity:0" />
    </radialGradient>

    <!-- Detailed 8-Pointed Star Mandala Pattern (Rub el Hizb) -->
    <pattern id="wahArabicPattern" x="0" y="0" width="140" height="140" patternUnits="userSpaceOnUse">
      <g stroke="#B89353" fill="none" opacity="0.22">
        <!-- Center Star 1 -->
        <rect x="52.5" y="52.5" width="35" height="35" stroke-width="1" />
        <rect x="52.5" y="52.5" width="35" height="35" stroke-width="1" transform="rotate(45 70 70)" />
        <!-- Concentric Ornaments -->
        <circle cx="70" cy="70" r="30" stroke-width="0.75" />
        <circle cx="70" cy="70" r="42" stroke-width="0.75" stroke-dasharray="3,3" />
        <circle cx="70" cy="70" r="54" stroke-width="0.5" />
        <!-- Corner Grid Lines -->
        <line x1="0" y1="70" x2="140" y2="70" stroke-width="0.6" opacity="0.6" />
        <line x1="70" y1="0" x2="70" y2="140" stroke-width="0.6" opacity="0.6" />
        <line x1="0" y1="0" x2="140" y2="140" stroke-width="0.5" opacity="0.4" />
        <line x1="140" y1="0" x2="0" y2="140" stroke-width="0.5" opacity="0.4" />
        <!-- Small Corner Stars -->
        <circle cx="0" cy="0" r="10" stroke-width="0.75" />
        <circle cx="140" cy="0" r="10" stroke-width="0.75" />
        <circle cx="0" cy="140" r="10" stroke-width="0.75" />
        <circle cx="140" cy="140" r="10" stroke-width="0.75" />
      </g>
    </pattern>

    <!-- Glowing Crescent & Star Emblem Watermark -->
    <g id="wahCrescentEmblem">
      <circle cx="80" cy="80" r="50" fill="none" stroke="#C9A96E" stroke-width="1.2" opacity="0.28" />
      <circle cx="80" cy="80" r="58" fill="none" stroke="#C9A96E" stroke-width="0.6" stroke-dasharray="4,3" opacity="0.25" />
      <!-- Moon Crescent -->
      <path d="M 72,52 A 28,28 0 1,0 96,96 A 22,22 0 1,1 72,52 Z" fill="#B89353" opacity="0.35" />
      <!-- Star -->
      <polygon points="98,62 101,69 108,69 103,74 105,81 98,76 91,81 93,74 88,69 95,69" fill="#B89353" opacity="0.45" />
    </g>

    <!-- Grand Arabic Arch Silhouette -->
    <g id="wahArabicArch">
      <path d="M 0,220 C 120,80 280,0 440,0 C 600,0 760,80 880,220 L 880,500 L 0,500 Z" fill="none" stroke="#C9A96E" stroke-width="1.8" opacity="0.22" />
      <path d="M 20,230 C 130,100 280,20 440,20 C 600,20 750,100 860,230" fill="none" stroke="#C9A96E" stroke-width="0.8" opacity="0.18" stroke-dasharray="6,4" />
    </g>
  </defs>

  <!-- Base Fill & Pattern -->
  <rect width="1440" height="2560" fill="url(#bgGrad)" />
  <rect width="1440" height="2560" fill="url(#goldSpotlight)" />
  <rect width="1440" height="2560" fill="url(#bottomGlow)" />
  <rect width="1440" height="2560" fill="url(#wahArabicPattern)" />

  <!-- Arabic Arches Watermark -->
  <use href="#wahArabicArch" x="280" y="80" />
  <use href="#wahArabicArch" x="280" y="1100" />
  <use href="#wahArabicArch" x="280" y="2000" />

  <!-- Crescent Emblems Watermark (Side Columns) -->
  <use href="#wahCrescentEmblem" x="30" y="240" />
  <use href="#wahCrescentEmblem" x="1250" y="240" />
  <use href="#wahCrescentEmblem" x="30" y="840" />
  <use href="#wahCrescentEmblem" x="1250" y="840" />
  <use href="#wahCrescentEmblem" x="30" y="1440" />
  <use href="#wahCrescentEmblem" x="1250" y="1440" />
  <use href="#wahCrescentEmblem" x="30" y="2040" />
  <use href="#wahCrescentEmblem" x="1250" y="2040" />

  <!-- Frame Vignette Border -->
  <rect x="20" y="20" width="1400" height="2520" fill="none" stroke="#C9A96E" stroke-width="1.5" opacity="0.3" rx="20" />
  <rect x="32" y="32" width="1376" height="2496" fill="none" stroke="#C9A96E" stroke-width="0.75" opacity="0.2" rx="16" stroke-dasharray="12,6" />
</svg>
