<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <style>
    .rose-line { stroke: #6e1c25; stroke-width: 0.8; fill: none; opacity: 0.45; }
    .leaf-line { stroke: #521319; stroke-width: 0.6; fill: none; opacity: 0.35; }
    .gold-accent { stroke: #d4af37; stroke-width: 0.5; fill: none; opacity: 0.18; }
  </style>
  <defs>
    <!-- Rose Flower Symbol 1 (Large) -->
    <g id="rose1">
      <!-- Center spiral -->
      <path d="M50 50 C48 45, 52 42, 55 45 C58 48, 55 55, 48 53 C40 50, 42 38, 50 35 C60 32, 68 45, 60 55 C52 65, 38 60, 35 48 C32 35, 48 25, 60 28 C72 30, 80 48, 68 62 C55 75, 32 68, 25 50" class="rose-line" />
      <!-- Outer Petals -->
      <path d="M25 50 C18 35, 38 18, 55 18 C72 18, 88 35, 80 55 C72 75, 45 82, 30 70" class="rose-line" />
      <path d="M15 45 C10 25, 30 10, 55 8 C80 6, 95 28, 90 50 C85 72, 60 90, 35 85 C20 80, 12 62, 15 45" class="rose-line" />
      <path d="M50 8 C60 10, 75 18, 80 28" class="gold-accent" />
      <path d="M20 65 C15 55, 12 40, 22 30" class="gold-accent" />
    </g>
    <!-- Rose Flower Symbol 2 (Small) -->
    <g id="rose2">
      <path d="M25 25 C24 22, 26 20, 27 22 C29 23, 27 27, 24 26 C20 25, 21 19, 25 17 C30 16, 34 22, 30 27 C26 32, 19 30, 17 24 C16 17, 24 12, 30 14 C36 15, 40 24, 34 31 C27 37, 16 34, 12 25" class="rose-line" />
      <path d="M12 25 C8 17, 19 9, 27 9 C36 9, 44 17, 40 27 C36 37, 22 41, 15 35" class="rose-line" />
    </g>
    <!-- Leaf 1 -->
    <g id="leaves">
      <!-- Stem -->
      <path d="M0 50 Q 25 35 50 50" class="leaf-line" />
      <!-- Leaf Left -->
      <path d="M20 43 Q 15 25 30 30 Q 35 40 20 43 Z" class="leaf-line" />
      <path d="M20 43 L 30 30" class="leaf-line" />
      <!-- Leaf Right -->
      <path d="M35 47 Q 45 30 50 40 Q 45 52 35 47 Z" class="leaf-line" />
      <path d="M35 47 L 50 40" class="leaf-line" />
      <!-- Gold leaf accent -->
      <path d="M15 25 Q 22 15 25 28 Z" class="gold-accent" />
    </g>
  </defs>

  <!-- Background overlay (none, transparent to show container gradient) -->
  
  <!-- Grid layout of roses and leaves -->
  <!-- Top Left -->
  <use href="#rose1" x="10" y="10" />
  <use href="#leaves" x="80" y="60" transform="rotate(15 80 60)" />
  <use href="#rose2" x="140" y="20" />
  
  <!-- Top Right -->
  <use href="#rose1" x="200" y="40" transform="scale(0.8) rotate(45 200 40)" />
  <use href="#leaves" x="220" y="120" transform="rotate(-35 220 120)" />
  
  <!-- Middle Left -->
  <use href="#leaves" x="20" y="160" transform="rotate(75 20 160)" />
  <use href="#rose2" x="80" y="130" />
  <use href="#rose1" x="30" y="200" transform="scale(0.9)" />
  
  <!-- Middle Right / Center -->
  <use href="#rose1" x="160" y="150" />
  <use href="#leaves" x="120" y="220" transform="rotate(120 120 220)" />
  
  <!-- Bottom Right -->
  <use href="#rose2" x="240" y="220" />
  <use href="#leaves" x="200" y="250" />
  <use href="#rose1" x="220" y="20" transform="scale(0.75)" />
</svg>
